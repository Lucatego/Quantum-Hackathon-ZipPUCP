<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collapse · prueba del juego</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e1220; color: #e8ecf4; font-family: system-ui, sans-serif; overflow: hidden; }
    canvas#game { display: block; width: 100vw; height: 100vh; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,10,20,0.85); padding: 16px; }
    .overlay .box { max-width: 520px; width: 100%; }
    .overlay button { font-size: 18px; padding: 10px 24px; border: 0; border-radius: 8px; background: #4fc3f7; color: #0e1220; cursor: pointer; }
    .overlay table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    .overlay td, .overlay th { border-bottom: 1px solid #333a50; padding: 4px 8px; text-align: left; }
    .stub { position: fixed; top: 8px; right: 8px; font-size: 12px; opacity: .6; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="stub">STUBS de Quantum y UI (solo para probar game.js)</div>

  <script>
    // ---- STUB de Quantum: fórmulas analíticas, NO es el simulador real (ese es js/quantum.js de Avix) ----
    // Sensor: con prob. sensorFlip percibe un sector equivocado (simplificado: una sola percepción por disparo).
    function perceive(target, flip) {
      if (flip > 0 && Math.random() < flip) { var w = Math.floor(Math.random() * 7); return w >= target ? w + 1 : w; }
      return target;
    }
    window.Quantum = {
      runQuantum: function (o) {
        var theta = Math.asin(1 / Math.sqrt(8));
        var a = Math.sin((2 * o.k + 1) * theta);
        var rest = Math.cos((2 * o.k + 1) * theta) / Math.sqrt(7);
        var marked = o.k > 0 ? perceive(o.target, o.sensorFlip || 0) : o.target;
        var amps = [], probs = [];
        for (var i = 0; i < 8; i++) {
          var v = i === marked ? a : rest;
          amps.push({ re: v, im: 0 });
          probs.push(v * v);
        }
        return { amps: amps, probs: probs, theory: a * a, misreads: marked === o.target ? 0 : 1 };
      },
      runClassical: function (o) {
        var order = [0, 1, 2, 3, 4, 5, 6, 7];
        for (var s = 7; s > 0; s--) {
          var j = Math.floor(Math.random() * (s + 1)), tmp = order[s];
          order[s] = order[j]; order[j] = tmp;
        }
        var discarded = [], found = false, hit = -1, misreads = 0;
        for (var q = 0; q < o.k; q++) {
          var seen = perceive(o.target, o.sensorFlip || 0);
          if (seen !== o.target) misreads++;
          if (seen === order[q]) { found = true; hit = order[q]; break; }
          discarded.push(order[q]);
        }
        var probs = [];
        for (var i = 0; i < 8; i++) {
          if (found) probs.push(i === hit ? 1 : 0);
          else probs.push(discarded.indexOf(i) >= 0 ? 0 : 1 / (8 - discarded.length));
        }
        return { probs: probs, discarded: discarded, found: found, theory: (o.k + 1) / 8, misreads: misreads };
      },
      sample: function (probs) {
        var r = Math.random(), acc = 0;
        for (var i = 0; i < probs.length; i++) { acc += probs[i]; if (r < acc) return i; }
        return probs.length - 1;
      },
      toQiskit: function (k) { return '# stub: aquí va el circuito con k = ' + k; },
      selfTest: function () { console.log('stub'); }
    };

    // ---- STUB de Quantum.runCircuit / gradient (contrato v3, tarea de Avix). Simulación mínima de 3 qubits
    // para probar el juego; el simulador oficial es js/quantum.js. φ = fase del marcador y del difusor (π = Grover). ----
    (function (Q) {
      function popc(x) { var c = 0; while (x) { c += x & 1; x >>= 1; } return c; }
      function gauss() { return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random()); }
      function sim(pieces, target, phaseNoise, sensorFlip, phi) {
        var re = [1, 0, 0, 0, 0, 0, 0, 0], im = [0, 0, 0, 0, 0, 0, 0, 0], misreads = 0, queries = 0;
        var ph = phi === undefined ? Math.PI : phi, fr = 1 - Math.cos(ph), fi = -Math.sin(ph); // f = 1 − e^{iφ}
        function noise() {
          if (!phaseNoise) return;
          var q = [gauss() * phaseNoise, gauss() * phaseNoise, gauss() * phaseNoise];
          for (var i = 0; i < 8; i++) {
            var a = 0; for (var b = 0; b < 3; b++) if ((i >> b) & 1) a += q[b];
            var c = Math.cos(a), s = Math.sin(a), r = re[i]; re[i] = r * c - im[i] * s; im[i] = r * s + im[i] * c;
          }
        }
        pieces.forEach(function (g) {
          var i, j;
          if (g === 'H') {
            var nr = [], ni = [];
            for (i = 0; i < 8; i++) { var sr = 0, si = 0; for (j = 0; j < 8; j++) { var sg = popc(i & j) % 2 ? -1 : 1; sr += sg * re[j]; si += sg * im[j]; } nr.push(sr / Math.sqrt(8)); ni.push(si / Math.sqrt(8)); }
            re = nr; im = ni;
          } else if (g === 'M') {
            queries++;
            var t = target;
            if (sensorFlip > 0 && Math.random() < sensorFlip) { var w = Math.floor(Math.random() * 7); t = w >= target ? w + 1 : w; misreads++; }
            var ar = re[t], ai = im[t]; re[t] = ar - (fr * ar - fi * ai); im[t] = ai - (fr * ai + fi * ar);
          } else if (g === 'D') {
            var mr = 0, mi = 0; for (i = 0; i < 8; i++) { mr += re[i]; mi += im[i]; } mr /= 8; mi /= 8;
            var kr = fr * mr - fi * mi, ki = fr * mi + fi * mr;
            for (i = 0; i < 8; i++) { re[i] = -(re[i] - kr); im[i] = -(im[i] - ki); }
          }
          noise();
        });
        var amps = [], probs = [];
        for (var k = 0; k < 8; k++) { amps.push({ re: re[k], im: im[k] }); probs.push(re[k] * re[k] + im[k] * im[k]); }
        return { amps: amps, probs: probs, misreads: misreads, queries: queries };
      }
      Q.runCircuit = function (o) {
        var r = sim(o.pieces, o.target, o.phaseNoise || 0, o.sensorFlip || 0, o.phi);
        var ideal = sim(o.pieces, o.target, 0, 0, o.phi).probs;
        return { amps: r.amps, probs: r.probs, ideal: ideal, theory: ideal[o.target], queries: r.queries, misreads: r.misreads };
      };
      // Acierto medio sin ruido y su derivada respecto de φ (diferencias finitas en el stub).
      Q.gradient = function (o) {
        var v = function (p) { return sim(o.pieces, 0, 0, 0, p).probs[0]; }, h = 1e-4;
        return { value: v(o.phi), dphi: (v(o.phi + h) - v(o.phi - h)) / (2 * h) };
      };
    })(window.Quantum);

    // ---- STUB de UI: dibujo mínimo (la UI real es js/ui.js de Gandy) ----
    window.UI = {
      drawHUD: function (ctx, s) {
        ctx.font = '15px system-ui, sans-serif';
        ctx.fillStyle = '#e8ecf4';
        ctx.fillText('Cañón: ' + (s.cannon === 'quantum' ? 'CUÁNTICO' : 'CLÁSICO') + '  [1/2]', 16, 26);
        ctx.fillText('k = ' + s.k + '  [Q/E]   costo: ' + s.cost, 16, 48);
        ctx.fillText('Vida: ' + Math.round(s.hp) + '   Bots: ' + s.botsLeft, 16, 70);
        ctx.fillStyle = '#333a50'; ctx.fillRect(16, 80, 200, 10);
        ctx.fillStyle = '#ffe066'; ctx.fillRect(16, 80, 2 * s.energy, 10);
        if (s.radar && Math.floor(performance.now() / 300) % 2 === 0) {
          ctx.fillStyle = '#ffe066';
          ctx.fillText('RADAR: hay alguien en la niebla (Espacio)', 16, 112);
        }
      },
      drawSectors: function (ctx, x, y, result, cannon) {
        var step = Math.PI / 4;
        for (var i = 0; i < 8; i++) {
          var a0 = i * step, a1 = (i + 1) * step;
          var len = 30 + result.probs[i] * 170;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.arc(x, y, len, a0, a1);
          ctx.closePath();
          var gone = result.discarded && result.discarded.indexOf(i) >= 0;
          ctx.fillStyle = gone ? 'rgba(120,120,120,0.35)' : 'rgba(79,195,247,0.35)';
          ctx.fill();
          if (cannon === 'quantum') {
            var amp = result.amps[i].re, mid = a0 + step / 2;
            ctx.strokeStyle = amp >= 0 ? '#7bd88f' : '#ff5c8a';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(mid) * 24, y + Math.sin(mid) * 24);
            ctx.lineTo(x + Math.cos(mid) * (24 + Math.abs(amp) * 120), y + Math.sin(mid) * (24 + Math.abs(amp) * 120));
            ctx.stroke();
          }
        }
      },
      showStart: function (onPlay) {
        overlay('<h1>COLLAPSE (prueba)</h1><p>WASD para moverte. Apunta con el mouse (clic dispara) o sin mouse: ← → giran el cañón, ↑ ↓ mueven la vista y F dispara.</p>' +
          '<p>Si el radar detecta a alguien en la niebla: elige cañón [1/2] y k [Q/E], y pulsa Espacio.</p>' +
          '<p>Clásico: descarta sectores. Cuántico: amplifica amplitudes.</p>', 'Jugar', onPlay);
      },
      showEnd: function (log, onReplay, history) {
        var groups = {};
        log.forEach(function (e) {
          var key = e.cannon + ' k=' + e.k;
          groups[key] = groups[key] || { n: 0, hits: 0, theory: e.theory };
          groups[key].n++; if (e.hit) groups[key].hits++;
        });
        var rows = Object.keys(groups).sort().map(function (key) {
          var g = groups[key];
          return '<tr><td>' + key + '</td><td>' + g.hits + '/' + g.n + '</td><td>' +
            Math.round(100 * g.hits / g.n) + '%</td><td>' + Math.round(100 * g.theory) + '%</td></tr>';
        }).join('');
        overlay('<h2>Fin de la partida</h2><table><tr><th>Cañón</th><th>Aciertos</th><th>Observado</th><th>Teoría</th></tr>' +
          (rows || '<tr><td colspan="4">Sin disparos de búsqueda</td></tr>') + '</table>' +
          '<p>En tormenta: ' + log.filter(function (e) { return e.zone === 'tormenta'; }).length +
          ' · con lecturas falsas del sensor: ' + log.filter(function (e) { return e.misreads > 0; }).length +
          ' · acumulado de la sesión: ' + (history || []).length + ' búsquedas</p>', 'Jugar otra vez', onReplay);
      }
    };

    // ---- STUB de Content: solo las pistas, para ver cuándo salen (el real es js/content.js de Alvaro) ----
    window.Content = {
      hints: {
        primeraBusqueda: '[pista] El radar sabe que hay alguien, pero no en cuál de los 8 sectores. Pulsa Espacio.',
        primerCuantico: '[pista] Primer disparo cuántico: mira las barras de amplitud antes del tiro.',
        aciertoCuantico: '[pista] Acierto cuántico con k ≥ 1.',
        sobreRotacion: '[pista] Fallo con k = 3: te pasaste de iteraciones.',
        tormenta: '[pista] Disparo en la tormenta: el sensor miente a veces, para ambos cañones.',
        ruidoCircuito: '[pista] Fallo con k = 2: puede ser el ruido del circuito.',
        kCero: '[pista] k = 0: disparo a ciegas, 1 de 8.'
      }
    };

    function overlay(html, label, cb) {
      var el = document.createElement('div');
      el.className = 'overlay';
      el.innerHTML = '<div class="box">' + html + '<button>' + label + '</button></div>';
      el.querySelector('button').onclick = function () { el.remove(); cb(); };
      document.body.appendChild(el);
    }
  </script>
  <script src="../js/game.js"></script>
  <script>
    UI.showStart(function () { Game.start(); });
  </script>
</body>
</html>
